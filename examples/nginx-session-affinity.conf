# Two mcp-proxy instances on the same host. Adapt listener/upstream addresses
# and terminate TLS before exposing this example publicly. See the crate's
# "Multiple replicas and sessions" guide and charts/mcp-proxy/README.md.
events { worker_connections 256; }
http {
    access_log off;
    upstream mcp_replicas {
        # Stable source-IP routing, including initialize and subsequent POST/GET/
        # DELETE requests. This is routing only; each proxy still authenticates.
        ip_hash;
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
    }
    server {
        listen 8080;
        location / {
            proxy_pass http://mcp_replicas;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # Never replay an ambiguous tool call on a different replica.
            proxy_next_upstream off;
        }
    }
}
