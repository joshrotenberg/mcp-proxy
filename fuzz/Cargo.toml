[package]
name = "mcp-proxy-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Isolate fuzz dependencies/profiles from the package's feature/MSRV checks.
[workspace]

[features]
default = ["yaml"]
yaml = ["mcp-proxy/yaml"]

[dependencies]
libfuzzer-sys = "=0.4.13"
mcp-proxy = { path = "..", default-features = false }
futures-util = "0.3"
serde_json = "1"
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-mcp = { version = "0.24.0", git = "https://github.com/joshrotenberg/tower-mcp", rev = "1eb3e4ec5f004dfb884004b2be2b083fafdbe88c", features = ["http", "http-client", "proxy"] }

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request_transform"
path = "fuzz_targets/request_transform.rs"
test = false
doc = false
bench = false
