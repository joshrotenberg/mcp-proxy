# Default values for mcp-proxy Helm chart

replicaCount: 1

image:
  repository: ghcr.io/joshrotenberg/mcp-proxy
  tag: ""  # Defaults to Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Application listener and named container/probe port, independent of service.port.
containerPort: 8080

# Proxy configuration (rendered as a Helm template into proxy.toml in a ConfigMap)
# This is the full mcp-proxy TOML config. See config.example.toml for all options.
config: |
  [proxy]
  name = "mcp-proxy"
  [proxy.listen]
  host = "0.0.0.0"
  port = {{ .Values.containerPort }}

  [observability]
  log_level = "info"
  json_logs = true
  [observability.metrics]
  enabled = true

# Extra environment variables (for ${VAR} references in config)
env: []
  # - name: GITHUB_TOKEN
  #   valueFrom:
  #     secretKeyRef:
  #       name: mcp-proxy-secrets
  #       key: github-token

# Create a Secret with token values (alternative to external secrets)
secrets: {}
  # github-token: "ghp_..."
  # backend-token: "sk-..."

service:
  type: ClusterIP
  # Client-facing Service port; traffic targets the named application port.
  port: 8080
  # MCP sessions belong to one process. Requires a stable source IP as seen by
  # the Service; ingress controllers may bypass it and need their own affinity.
  sessionAffinity: ClientIP
  sessionAffinityTimeoutSeconds: 10800

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: mcp-proxy.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: mcp-proxy-tls
    #   hosts:
    #     - mcp-proxy.example.com

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Credential-free process probes use /livez and /readyz.
# Readiness indicates startup completed, not aggregate backend health.
probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

serviceAccount:
  create: true
  annotations: {}
  name: ""
  # mcp-proxy does not call the Kubernetes API. Set true only if an extension
  # or sidecar in this pod needs the service-account token.
  automount: false

podAnnotations: {}

# Restricted profile (Pod Security Standards "restricted"). The image runs as
# UID/GID 65532; the root filesystem is read-only, with writable emptyDir
# volumes at /tmp and /var/lib/mcp-proxy (see writableVolumes).
# Helm merges maps with these defaults: override individual keys, or set a
# whole context to null to remove it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# emptyDir volumes mounted writable so a read-only root filesystem keeps scratch
# space for stdio backends (/tmp) and file-backed state (/var/lib/mcp-proxy).
# Set to [] to mount none.
writableVolumes:
  - name: tmp
    mountPath: /tmp
  - name: state
    mountPath: /var/lib/mcp-proxy
